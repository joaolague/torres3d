name: Arquivar previsões

on:
  schedule:
    # 06:40 and 18:40 UTC, after the 00Z and 12Z model runs are published
    - cron: "40 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-forecast
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar e salvar previsões
        run: python tools/archive_forecast.py --hours 72

      - name: Commit
        run: |
          git config user.name "torres3d-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "Nada novo para arquivar."
            exit 0
          fi
          git commit -m "Arquivo de previsões $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
