name: Arquivar previsões

on:
  schedule:
    # four times a day, after each model cycle is published (00Z, 06Z, 12Z, 18Z)
    - cron: "40 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: archive-forecast
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar e salvar previsões
        run: python tools/archive_forecast.py --hours 72 --latest data/forecast-latest.json

      - name: Commit
        run: |
          git config user.name "torres3d-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive data/forecast-latest.json
          if git diff --cached --quiet; then
            echo "Nada novo para arquivar."
            exit 0
          fi
          git commit -m "Arquivo de previsões $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
          # publish the fresh snapshot on the site (gh-pages mirrors main)
          git push --force origin HEAD:gh-pages

      - name: Publicar o site
        # pushes made with GITHUB_TOKEN may not trigger the Pages build by themselves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed (site updates on the next push)"
